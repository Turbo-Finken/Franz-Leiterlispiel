<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leiterli RPG | Bot Edition</title>
   
    <link href="https://googleapis.com" rel="stylesheet">
   
    <style>
        :root {
            --p1: #ff4757; --p2: #3498db; --accent: #1dd1a1;
            --glass: rgba(20, 20, 30, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }
 
        * { box-sizing: border-box; -webkit-user-select: none; margin: 0; padding: 0; }
       
        body {
            font-family: 'Nunito', sans-serif; background: #0f0c29;
            color: white; overflow: hidden; height: 100vh;
        }
 
        /* --- WORLD SYSTEM --- */
        #viewport { width: 100vw; height: 100vh; perspective: 1200px; overflow: hidden; }
 
        #world {
            position: absolute; transform-style: preserve-3d;
            /* Schnelle Kamera-Reaktion */
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            will-change: transform;
        }
 
        #board {
            display: grid; grid-template-columns: repeat(10, 180px);
            grid-template-rows: repeat(10, 180px); gap: 30px; padding: 2200px;
        }
 
        /* --- FELDER --- */
        .cell {
            width: 180px; height: 180px; background: white; border-radius: 45px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); color: #2f3542;
            font-weight: 900; position: relative; font-size: 2.5rem;
        }
        .cell.ladder { border: 8px solid var(--accent); background: #f0fff4; }
        .cell.snake { border: 8px solid var(--p1); background: #fff5f5; }
        .cell-num { position: absolute; top: 15px; left: 20px; opacity: 0.15; font-size: 1.4rem; }
 
        /* --- SPIELER --- */
        .player {
            width: 85px; height: 85px; border-radius: 50%; position: absolute; z-index: 500;
            border: 6px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
            /* Smoother Walk-Speed */
            transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
        }
 
        /* --- UI --- */
        .panel {
            position: fixed; background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); padding: 30px; border-radius: 40px; z-index: 1000;
        }
 
        #ui-right { right: 40px; top: 50%; transform: translateY(-50%); width: 260px; text-align: center; }
        #ui-bottom { left: 40px; bottom: 40px; width: 320px; max-height: 150px; overflow: hidden; }
 
        .btn {
            background: var(--accent); color: white; border: none; padding: 20px;
            border-radius: 25px; cursor: pointer; font-family: 'Fredoka'; font-weight: 700;
            font-size: 1.4rem; box-shadow: 0 8px 0 #10ac84; transition: 0.2s; width: 100%;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #10ac84; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
 
        /* --- MODAL --- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; place-items: center; z-index: 5000;
        }
        .modal-card { background: white; color: #222; padding: 40px; border-radius: 45px; width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; font-size: 2rem; text-align: center; border-radius: 15px; border: 2px solid #ddd; margin: 20px 0; }
 
        #launcher {
            position: fixed; inset: 0; background: #0f0c29;
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
 
    <div id="launcher">
        <h1 style="font-family: 'Fredoka'; font-size: 4rem;">LEITERLI RPG</h1>
        <div style="display:flex; gap: 20px; margin-top: 30px;">
            <button class="btn" style="width: 220px;" onclick="Engine.init(true)">BOT 🤖</button>
            <button class="btn" style="width: 220px; background: var(--p2); box-shadow: 0 8px 0 #2980b9;" onclick="Engine.init(false)">2 SPIELER 👥</button>
        </div>
    </div>
 
    <div id="viewport">
        <div id="world">
            <div id="board"></div>
            <div id="players-layer"></div>
        </div>
    </div>
 
    <div class="panel" id="ui-right" style="display:none;">
        <div id="turn-label" style="font-weight: 900; font-size: 1.4rem; color: var(--accent);">SPIELER 1</div>
        <div id="dice-box" style="font-size: 6rem; margin: 20px 0;">🎲</div>
        <button class="btn" id="roll-btn" onclick="Engine.roll()">WÜRFELN</button>
    </div>
 
    <div class="panel" id="ui-bottom" style="display:none;">
        <div id="log" style="font-size: 0.9rem; color: #ccc; line-height: 1.5;"></div>
    </div>
 
    <div class="modal" id="modal">
        <div class="modal-card" id="modal-inner"></div>
    </div>
 
   <script>
    const Engine = {
        state: {
    players: [],
    turn: 0,
    isBot: false,
    moving: false,
    mode: "FR",
    wrongAttempts: 0,

},

 
        // Vollständige Vokabelliste
        vocList: [
            { f: "là", d: "da, dort" }, { f: "lac", d: "See" }, { f: "langue", d: "Sprache, Zunge" },
            { f: "lave-vaisselle", d: "Geschirrspüler" }, { f: "laver", d: "waschen" },
            { f: "légume", d: "Gemüse" }, { f: "lever", d: "heben, hochziehen" }, { f: "lire", d: "lesen" },
            { f: "lis", d: "ich lese" }, { f: "lit", d: "Bett" }, { f: "livre", d: "Buch" },
            { f: "livre de français", d: "Französischbuch" }, { f: "loger", d: "übernachten" },
            { f: "longtemps", d: "lange" }, { f: "louer", d: "mieten" }, { f: "lu", d: "gelesen" },
            { f: "luge", d: "Schlitten" }, { f: "lui", d: "ihm, ihr" }, { f: "lunettes de soleil", d: "Sonnenbrille" },
            { f: "magasin", d: "Laden, Geschäft" }, { f: "maillot de bain", d: "Badeanzug, Badehose" },
            { f: "main", d: "Hand" }, { f: "maintenant", d: "jetzt" }, { f: "mais", d: "aber" },
            { f: "maison", d: "Haus" }, { f: "mal", d: "schlecht" }, { f: "malade", d: "krank" },
            { f: "malentendu", d: "Missverständnis" }, { f: "malheureusement", d: "leider" },
            { f: "manger", d: "essen" }, { f: "maquiller", d: "schminken" }, { f: "marché", d: "Markt" },
            { f: "match de hockey", d: "Hockeymatch" }, { f: "mauvais", d: "schlecht" },
            { f: "me", d: "mich, mir" }, { f: "médecin", d: "Arzt" }, { f: "médicament", d: "Medikament" },
            { f: "meilleur", d: "besser" }, { f: "même", d: "gleich, sogar" }, { f: "mémoriser", d: "einprägen" },
            { f: "menti", d: "gelogen" }, { f: "mer", d: "Meer" }, { f: "message", d: "Nachricht" },
            { f: "métier", d: "Beruf" }, { f: "mettre", d: "legen, stellen, anziehen" }, { f: "mieux", d: "besser" },
            { f: "mis", d: "gelegt, gestellt, angezogen" }, { f: "moche", d: "hässlich" },
            { f: "moi", d: "ich, mich, mir" }, { f: "moins", d: "weniger, minus" }, { f: "mois", d: "Monat" },
            { f: "monde", d: "Welt, Leute" }, { f: "montagne", d: "Berg" }, { f: "monter", d: "hinaufsteigen" },
            { f: "musique", d: "Musik" }, { f: "nager", d: "schwimmen" }, { f: "neige", d: "Schnee" },
            { f: "nerveux", d: "nervös" }, { f: "nettoyer", d: "reinigen" }, { f: "nez", d: "Nase" },
            { f: "note", d: "Notiz, Note" }, { f: "nouveau", d: "neu" }, { f: "nuit", d: "Nacht" },
            { f: "objet", d: "Gegenstand" }, { f: "observer", d: "beobachten" }, { f: "œil", d: "Auge" },
            { f: "ordinateur", d: "Computer" }, { f: "ordonné", d: "ordentlich" }, { f: "oreille", d: "Ohr" },
            { f: "original", d: "originell" }, { f: "où", d: "wo" }, { f: "oublier", d: "vergessen" },
            { f: "ouvre", d: "ich öffne" }, { f: "ouvrez", d: "ihr öffnet" }, { f: "paniquer", d: "panik" },
            { f: "pansement", d: "Verband" }, { f: "pantalon", d: "Hose" }, { f: "par", d: "pro, durch" },
            { f: "parce que", d: "weil" }, { f: "parents", d: "Eltern" }, { f: "paresseux", d: "faul" },
            { f: "parfait", d: "perfekt" }, { f: "parler", d: "sprechen" }, { f: "parti", d: "abgereist" },
            { f: "pas du tout", d: "überhaupt nicht" }, { f: "passé", d: "vergangen" },
            { f: "passeport", d: "Reisepass" }, { f: "passer", d: "verbringen, vorbeigehen" },
            { f: "patient", d: "Patient" }, { f: "pays", d: "Land" }, { f: "paysage", d: "Landschaft" },
            { f: "pendant", d: "während" }, { f: "personne", d: "Person" }, { f: "petit-déjeuner", d: "Frühstück" },
            { f: "petit", d: "klein" }, { f: "peu", d: "wenig" }, { f: "peur", d: "Angst" },
            { f: "peux", d: "ich kann" }, { f: "photo", d: "Foto" }, { f: "piano", d: "Klavier" },
            { f: "pied", d: "Fuss" }, { f: "piscine", d: "Schwimmbad" }, { f: "plage", d: "Strand" },
            { f: "planète", d: "Planet" }, { f: "plein de", d: "viele" }, { f: "pleut", d: "es regnet" },
            { f: "plus", d: "mehr" }, { f: "plusieurs", d: "mehrere" }, { f: "points communs", d: "Gemeinsamkeiten" },
            { f: "polluant", d: "umweltverschmutzend" }, { f: "portable", d: "Handy" }, { f: "porte", d: "Tür" },
            { f: "porte-monnaie", d: "Portemonnaie" }, { f: "Portugal", d: "Portugal" },
            { f: "possible", d: "möglich" }, { f: "pouls", d: "Puls" }, { f: "pour", d: "für, um zu" },
            { f: "pourquoi", d: "warum" }, { f: "pouvoir", d: "können, dürfen" },
            { f: "pratique", d: "praktisch" }, { f: "premier", d: "erste" }
        ],
 
        
        init(bot) {
            this.state.isBot = bot;
            document.getElementById('launcher').style.display = 'none';
            document.getElementById('ui-right').style.display = 'block';
            document.getElementById('ui-bottom').style.display = 'block';
            this.createModeButton();
            this.buildBoard();
            this.spawnPlayers();
            this.updateCamera();
            this.log("Spiel gestartet!");
        },
 
        createModeButton() {
            const btn = document.createElement('button');
            btn.id = "mode-toggle";
            btn.className = "panel";
            btn.style.cssText = "position:fixed; top:20px; right:20px; cursor:pointer; font-weight:bold; color:var(--accent); z-index:2000;";
            btn.innerText = "🔄 MODUS: FRANZÖSISCH";
            btn.onclick = () => {
                this.state.mode = this.state.mode === "FR" ? "DE" : "FR";
                btn.innerText = this.state.mode === "FR" ? "🔄 MODUS: FRANZÖSISCH" : "🔄 MODUS: DEUTSCH";
                this.log("Modus gewechselt!");
            };
            document.body.appendChild(btn);
        },
 
        buildBoard() {
            const b = document.getElementById('board');
            for (let i = 1; i <= 100; i++) {
                const idx = 101 - i;
                const cell = document.createElement('div');
                cell.className = 'cell'; cell.id = `c-${idx}`;
                cell.innerHTML = `<span class="cell-num">${idx}</span>`;
                if(idx > 1 && idx < 98) {
                    const r = Math.random();
                    if(r < 0.1) { cell.classList.add('ladder'); cell.innerHTML += '🪜'; cell.dataset.type = 'up'; }
                    else if(r < 0.2) { cell.classList.add('snake'); cell.innerHTML += '🐍'; cell.dataset.type = 'down'; }
                }
                b.appendChild(cell);
            }
        },
 
        spawnPlayers() {
            const layer = document.getElementById('players-layer');
            for (let i = 0; i < 2; i++) {
                const p = { id: i, pos: 1, el: document.createElement('div') };
                p.el.className = 'player';
                p.el.style.background = i === 0 ? 'var(--p2)' : 'var(--p1)';
                p.el.innerText = i === 0 ? '👤' : (this.state.isBot ? '🤖' : '👤');
                layer.appendChild(p.el);
                this.state.players.push(p);
                this.sync(i);
            }
        },
 
        sync(idx) {
            const p = this.state.players[idx];
            const cell = document.getElementById(`c-${p.pos}`);
            p.el.style.left = `${cell.offsetLeft + 90}px`;
            p.el.style.top = `${cell.offsetTop + 90}px`;
        },
 
        updateCamera() {
            const p = this.state.players[this.state.turn];
            const x = parseInt(p.el.style.left), y = parseInt(p.el.style.top);
            document.getElementById('world').style.transform = `translate3d(${window.innerWidth/2 - x}px, ${window.innerHeight/2 - y}px, 0) rotateX(15deg)`;
        },
 
        async roll() {
            if(this.state.moving) return;
            this.state.moving = true;
            document.getElementById('roll-btn').disabled = true;
            const r = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-box').innerText = ['🎲','⚀','⚁','⚂','⚃','⚄','⚅'][r];
            await this.moveSequence(r);
            if(this.state.players[this.state.turn].pos < 100) { this.askQuiz(); }
            else { alert("Gewonnen!"); location.reload(); }
        },
 
        async moveSequence(steps) {
            const p = this.state.players[this.state.turn];
            for(let i = 0; i < steps; i++) {
                if(p.pos >= 100) break;
                p.pos++;
                this.sync(this.state.turn);
                this.updateCamera();
                await new Promise(res => setTimeout(res, 400));
            }
            const cell = document.getElementById(`c-${p.pos}`);
            if(cell.dataset.type === 'up') { p.pos = Math.min(100, p.pos + 12); this.log("Leiter! +12"); }
            else if(cell.dataset.type === 'down') { p.pos = Math.max(1, p.pos - 12); this.log("Schlange! -12"); }
            this.sync(this.state.turn);
            this.updateCamera();
        },
 
        askQuiz() {
            const modal = document.getElementById('modal');
            const inner = document.getElementById('modal-inner');
            const voc = this.vocList[Math.floor(Math.random() * this.vocList.length)];
            const anzeige = this.state.mode === "FR" ? voc.d : voc.f;
            const loesung = this.state.mode === "FR" ? voc.f : voc.d;
 
            modal.style.display = 'grid';
            inner.innerHTML = `
                <h2 style="color:#2f3542">QUIZ-ZEIT! 🧩</h2>
                <p style="margin:10px 0;">Übersetze auf <b>${this.state.mode === "FR" ? 'Französisch' : 'Deutsch'}</b>:</p>
                <div style="font-size:2.2rem; font-weight:900; color:var(--p2); margin:15px 0;">${anzeige}</div>
                <input type="text" id="q-ans" autofocus autocomplete="off">
                <button class="btn" id="q-btn">PRÜFEN</button>
            `;
 
            const check = () => {
                const val = document.getElementById('q-ans').value.trim().toLowerCase();
                const solutions = loesung.toLowerCase().split(',').map(s => s.trim());
                if(solutions.includes(val)) {
                    this.log("Richtig! ✅");
                    modal.style.display = 'none';
                    this.nextTurn();
                } else {
                    const penalty = Math.floor(Math.random() * 6) + 1;
                    this.state.players[this.state.turn].pos = Math.max(1, this.state.players[this.state.turn].pos - penalty);
                    this.log(`Falsch! ❌ ${penalty} zurück. (Lösung: ${loesung})`);
                    this.sync(this.state.turn);
                    this.updateCamera();
                    document.getElementById('q-ans').value = "";
                }
            };
 
            document.getElementById('q-btn').onclick = check;
            document.getElementById('q-ans').onkeypress = (e) => { if(e.key === 'Enter') check(); };
           
            if(this.state.isBot && this.state.turn === 1) {
                setTimeout(() => { document.getElementById('q-ans').value = loesung.split(',')[0].trim(); check(); }, 2000);
            }
        },
 
        nextTurn() {
            this.state.turn = this.state.turn === 0 ? 1 : 0;
            this.state.moving = false;
            document.getElementById('roll-btn').disabled = false;
            document.getElementById('turn-label').innerText = `SPIELER ${this.state.turn + 1}`;
            document.getElementById('turn-label').style.color = this.state.turn === 0 ? 'var(--p2)' : 'var(--p1)';
            this.updateCamera();
            if(this.state.isBot && this.state.turn === 1) setTimeout(() => this.roll(), 1000);
        },
 
        log(msg) {
            const l = document.getElementById('log');
            l.innerHTML = `<div>• ${msg}</div>` + l.innerHTML;
        }
    };
</script>
</body>
</html>
